<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <rect width="440" height="320" fill="#e8f0f8"/>

  <!-- Client (left) -->
  <circle cx="90" cy="108" r="32" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="90" cy="100" r="13" fill="#e8f0f8"/>
  <circle cx="90" cy="96" r="8" fill="#94a3b8"/>
  <path d="M70 116q20-14 40 0" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <!-- Question bubble -->
  <rect x="28" y="152" width="96" height="44" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <polygon points="66,152 54,138 78,152" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="170" text-anchor="middle" fill="#64748b" font-size="20" font-weight="700">?</text>
  <text x="76" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">何から始めれば…</text>
  <text x="90" y="224" text-anchor="middle" fill="#94a3b8" font-size="12">クライアント</text>

  <!-- テクイロ (right) -->
  <circle cx="350" cy="108" r="32" fill="#1a3a5c"/>
  <text x="350" y="113" text-anchor="middle" fill="white" font-size="12" font-weight="700">テクイロ</text>
  <!-- Answer bubble -->
  <rect x="316" y="152" width="96" height="44" rx="8" fill="#1a3a5c"/>
  <polygon points="356,152 342,138 370,152" fill="#1a3a5c"/>
  <text x="364" y="170" text-anchor="middle" fill="white" font-size="13" font-weight="700">!</text>
  <text x="364" y="186" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">一緒に整理します</text>
  <text x="350" y="224" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="700">テクイロ</text>

  <!-- Output: plan document (wider box fitting all content) -->
  <rect x="60" y="244" width="320" height="64" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="244" width="320" height="22" rx="8" fill="#1a3a5c"/>
  <rect x="60" y="258" width="320" height="8" fill="#1a3a5c"/>
  <text x="220" y="258" text-anchor="middle" fill="white" font-size="9" font-weight="700">ヒアリング後の提案書</text>

  <!-- 2-column bullet items inside box -->
  <circle cx="80" cy="277" r="4" fill="#4a90d9"/>
  <text x="90" y="281" fill="#64748b" font-size="9">課題の整理</text>
  <circle cx="80" cy="295" r="4" fill="#4a90d9"/>
  <text x="90" y="299" fill="#64748b" font-size="9">優先度の設定</text>

  <circle cx="240" cy="277" r="4" fill="#4a90d9"/>
  <text x="250" y="281" fill="#64748b" font-size="9">システム要件の定義</text>
  <circle cx="240" cy="295" r="4" fill="#4a90d9"/>
  <text x="250" y="299" fill="#64748b" font-size="9">スケジュール案</text>

  <!-- Arrow pointing down to doc -->
  <line x1="220" y1="214" x2="220" y2="240" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="220,244 214,236 226,236" fill="#4a90d9"/>

  <!-- Dashed line between people -->
  <line x1="130" y1="108" x2="310" y2="108" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
