  <text x="350" y="117" text-anchor="middle" fill="#4a90d9" font-size="9" font-weight="700">-iro</text>
  <!-- Answer bubble -->
  <rect x="324" y="152" width="88" height="44" rx="8" fill="#1a3a5c"/>
