  <text x="350" y="224" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="700">テクイロ</text>

  <!-- Output: plan document -->
  <rect x="148" y="236" width="144" height="68" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="148" y="236" width="144" height="22" rx="8" fill="#1a3a5c"/>
  <rect x="148" y="250" width="144" height="8" fill="#1a3a5c"/>
  <text x="220" y="250" text-anchor="middle" fill="white" font-size="9" font-weight="700">ヒアリング後の提案書</text>
  <circle cx="168" cy="270" r="4" fill="#4a90d9"/>
  <line x1="178" y1="270" x2="276" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="168" cy="286" r="4" fill="#4a90d9"/>
