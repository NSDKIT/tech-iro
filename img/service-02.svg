<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <rect width="440" height="320" fill="#e8f0f8"/>

  <!-- LEFT panel: 現状の課題 -->
  <rect x="20" y="72" width="168" height="176" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="72" width="168" height="28" rx="10" fill="#64748b"/>
  <rect x="20" y="92" width="168" height="8" fill="#64748b"/>
  <text x="104" y="90" text-anchor="middle" fill="white" font-size="11" font-weight="700">現状の課題</text>

  <!-- Item 1 -->
  <rect x="30" y="110" width="148" height="38" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="48" y="127" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="900">✕</text>
  <text x="62" y="125" fill="#be123c" font-size="10" font-weight="700">動作が遅い</text>
  <text x="62" y="139" fill="#94a3b8" font-size="9">画面表示に8秒以上かかる</text>

  <!-- Item 2 -->
  <rect x="30" y="156" width="148" height="38" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="48" y="173" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="900">✕</text>
  <text x="62" y="171" fill="#be123c" font-size="10" font-weight="700">エラーが頻発</text>
  <text x="62" y="185" fill="#94a3b8" font-size="9">データ保存に失敗することも</text>

  <!-- Item 3 -->
  <rect x="30" y="202" width="148" height="38" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="48" y="219" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="900">✕</text>
  <text x="62" y="217" fill="#be123c" font-size="10" font-weight="700">使いづらいUI</text>
  <text x="62" y="231" fill="#94a3b8" font-size="9">操作ミスが多発する</text>

  <text x="104" y="268" text-anchor="middle" fill="#94a3b8" font-size="12">旧システム</text>

  <!-- CENTER arrow at cy=160 -->
  <circle cx="220" cy="160" r="28" fill="#1a3a5c"/>
  <path d="M208 160h24M221 150l10 10-10 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="220" y="206" text-anchor="middle" fill="#64748b" font-size="10">診断・改善</text>

  <!-- RIGHT panel: 改善後 -->
  <rect x="252" y="72" width="168" height="176" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="252" y="72" width="168" height="28" rx="10" fill="#1a3a5c"/>
  <rect x="252" y="92" width="168" height="8" fill="#1a3a5c"/>
  <text x="336" y="90" text-anchor="middle" fill="white" font-size="11" font-weight="700">改善後</text>

  <!-- Item 1 -->
  <rect x="262" y="110" width="148" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="280" y="127" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="900">✓</text>
  <text x="294" y="125" fill="#15803d" font-size="10" font-weight="700">高速表示</text>
  <text x="294" y="139" fill="#94a3b8" font-size="9">表示時間を1秒以内に改善</text>

  <!-- Item 2 -->
  <rect x="262" y="156" width="148" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="280" y="173" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="900">✓</text>
  <text x="294" y="171" fill="#15803d" font-size="10" font-weight="700">安定稼働</text>
  <text x="294" y="185" fill="#94a3b8" font-size="9">エラー率ゼロを達成</text>

  <!-- Item 3 -->
  <rect x="262" y="202" width="148" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="280" y="219" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="900">✓</text>
  <text x="294" y="217" fill="#15803d" font-size="10" font-weight="700">直感的なUI</text>
  <text x="294" y="231" fill="#94a3b8" font-size="9">操作ミスを大幅に削減</text>

  <text x="336" y="268" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="700">改善後</text>
</svg>
