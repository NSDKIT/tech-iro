<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <rect width="440" height="320" fill="#e8f0f8"/>

  <!-- OLD system -->
  <rect x="32" y="80" width="152" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="80" width="152" height="26" rx="10" fill="#64748b"/>
  <rect x="32" y="98" width="152" height="8" fill="#64748b"/>
  <!-- Error state inside screen -->
  <circle cx="108" cy="152" r="30" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <line x1="98" y1="142" x2="118" y2="162" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="142" x2="98" y2="162" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Issue tags below -->
  <rect x="40" y="212" width="136" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="108" y="226" text-anchor="middle" fill="#ef4444" font-size="11">エラー頻発・動作が遅い</text>
  <text x="108" y="258" text-anchor="middle" fill="#94a3b8" font-size="12">旧システム</text>

  <!-- Center: improvement arrow -->
  <rect x="186" y="136" width="68" height="48" rx="10" fill="#1a3a5c"/>
  <path d="M200 168l20-20 20 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M210 168l10-10 10 10" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  <text x="220" y="200" text-anchor="middle" fill="#64748b" font-size="11">改善</text>

  <!-- NEW system -->
  <rect x="256" y="80" width="152" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="256" y="80" width="152" height="26" rx="10" fill="#1a3a5c"/>
  <rect x="256" y="98" width="152" height="8" fill="#1a3a5c"/>
  <!-- Success state inside screen -->
  <circle cx="332" cy="152" r="30" fill="#dcfce7" stroke="#bbf7d0" stroke-width="2"/>
  <path d="M318 152l10 10 16-18" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Speed indicator -->
  <rect x="264" y="212" width="136" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="332" y="226" text-anchor="middle" fill="#16a34a" font-size="11">高速・安定稼働</text>
  <text x="332" y="258" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="700">改善後</text>
</svg>
